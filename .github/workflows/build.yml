name: Build

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug build
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          python3 - <<'PY'
          import re, urllib.parse
          lines = open("build.log", errors="replace").read().splitlines()
          keep = [l for l in lines if re.search(r"(^e: |error:|FAILED|What went wrong|Execution failed|Caused by|Could not|Unresolved|AAPT|lint)", l)]
          text = "\n".join(keep[:40]) or "\n".join(lines[-40:])
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=Gradle build failed::" + text[:3500])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: comatose-debug-apk
          path: app/build/outputs/apk/debug/*.apk
